name: Release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          AIL_RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/build_release.py --check-tag "$AIL_RELEASE_TAG"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build source release with installer
        run: python tools/build_release.py
      - name: Build Python distributions
        run: |
          python -m pip install build
          python -m build
      - name: Upload downloadable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ail-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30
