name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils
      - name: Unit and installer integration tests
        run: python -m unittest discover -s tests -v
      - name: Generated example and schema consistency
        run: |
          python tools/generate_examples.py
          python tools/generate_schema.py
          git diff --exit-code -- examples ail.schema.json
      - name: Packaging tools
        run: python -m pip install build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify wheel outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/ail-wheel"
          "$RUNNER_TEMP/ail-wheel/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ail-wheel/bin/ail" --version
          "$RUNNER_TEMP/ail-wheel/bin/ail" doctor
          AIL_EXAMPLES=$("$RUNNER_TEMP/ail-wheel/bin/ail" examples)
          "$RUNNER_TEMP/ail-wheel/bin/ail" run "$AIL_EXAMPLES/hello.ail.json" --timeout 5
